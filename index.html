<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alleviate Referral Hub — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Outfit',sans-serif;
  background:linear-gradient(135deg,#0d2137 0%,#1a3c5e 50%,#0d2137 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:#fff;border-radius:20px;padding:44px 40px;
  width:100%;max-width:380px;
  box-shadow:0 24px 64px rgba(0,0,0,0.3);
}
.brand{margin-bottom:32px}
.brand-name{
  font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:700;
  color:#0d2137;letter-spacing:-0.01em;
}
.brand-sub{font-size:0.68rem;color:#6b7280;text-transform:uppercase;letter-spacing:0.14em;margin-top:3px}
.brand-divider{width:36px;height:3px;background:#c9a84c;border-radius:2px;margin-top:10px}
label{display:block;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:#6b7280;margin-bottom:6px;font-weight:500}
input{
  width:100%;border:1.5px solid #e5e7eb;border-radius:10px;
  padding:12px 14px;font-family:'Outfit',sans-serif;font-size:0.9rem;
  color:#0d2137;background:#f9fafb;outline:none;
  margin-bottom:18px;transition:border-color .15s,background .15s;
}
input:focus{border-color:#1a3c5e;background:#fff}
.btn{
  width:100%;padding:13px;background:#0d2137;color:#fff;border:none;
  border-radius:100px;font-family:'Outfit',sans-serif;font-size:0.88rem;
  font-weight:500;cursor:pointer;letter-spacing:0.03em;
  transition:background .15s;margin-top:4px;
}
.btn:hover{background:#1a3c5e}
.err{
  display:none;margin-top:14px;padding:10px 13px;
  background:#fef2f2;color:#dc2626;border-radius:8px;font-size:0.78rem;
}
.hint{margin-top:20px;font-size:0.72rem;color:#9ca3af;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-name">Alleviate</div>
    <div class="brand-sub">Referral Hub</div>
    <div class="brand-divider"></div>
  </div>
  <form id="form">
    <label>Username</label>
    <input id="user" autocomplete="username" placeholder="Enter username" required>
    <label>Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Enter password" required>
    <button class="btn" type="submit">Sign In</button>
    <div class="err" id="err">Incorrect username or password.</div>
  </form>
  <div class="hint">Alleviate Physiotherapy — Staff Access Only</div>
</div>
<script>
// Credentials — change these as needed
const CREDS = { admin:'Alleviate2024', vatsal:'Alleviate2024', front:'Alleviate2024' };

document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  const u=document.getElementById('user').value.trim().toLowerCase();
  const p=document.getElementById('pass').value;
  if(CREDS[u]&&CREDS[u]===p){
    sessionStorage.setItem('rh_auth','1');
    sessionStorage.setItem('rh_user',u);
    location.href='app.html';
  } else {
    document.getElementById('err').style.display='block';
  }
});
</script>
</body>
</html>
